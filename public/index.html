<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="https://yourwebsite.com/path/to/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Stay updated with the latest news articles from around the world across various categories." />
    
    <!-- Open Graph tags -->
    <meta property="og:title" content="Around Us - Global News" />
    <meta property="og:description" content="Explore the latest news articles from various categories worldwide." />
    <meta property="og:image" content="https://yourwebsite.com/path/to/logo192.png" />
    <meta property="og:url" content="https://aroundus.vercel.app" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Around Us - Global News" />
    <meta name="twitter:description" content="Explore the latest news articles from various categories worldwide." />
    <meta name="twitter:image" content="https://yourwebsite.com/path/to/logo192.png" />

    <link rel="apple-touch-icon" href="https://yourwebsite.com/path/to/logo192.png" />
    <link rel="manifest" href="https://yourwebsite.com/path/to/manifest.json" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <title>Around Us - Your Source for Global News</title>
    
    <!-- Add structured data for articles -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NewsArticle",
      "headline": "Breaking News: Major Event Happens",  <!-- Replace with dynamic title -->
      "image": [
        "https://yourwebsite.com/path/to/article-image.jpg"  <!-- Replace with dynamic image -->
      ],
      "datePublished": "2023-10-31T08:00:00+08:00",  <!-- Update dynamically -->
      "author": {
        "@type": "Person",
        "name": "JShubham Balgotra"  <!-- Replace with dynamic author name -->
      },
      "publisher": {
        "@type": "Organization",
        "name": "esPeEsA",  <!-- Replace with your organization -->
        "logo": {
          "@type": "ImageObject",
          "url": "https://yourwebsite.com/path/to/logo192.png"
        }
      }
    }
    </script>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
